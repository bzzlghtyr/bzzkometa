# Add CAM, Telesync and Hardcoded Subtitles warnings on movie posters

overlays:

  CAM:
    plex_all: true
    filters:
      filepath.regex: (?i)\bCAM\b
    overlay:
      name: CAM
      file: /config/cam_overlay/CAM.png
      group: movie_info
      weight: 3
    allowed_library_types: movie

  TELESYNC:
    plex_all: true
    filters:
      filepath.regex: (?i)\bTELESYNC\b
    overlay:
      name: TELESYNC
      file: /config/overlays/images/CAM.png
      group: movie_info
      weight: 2
    allowed_library_types: movie

  # HCS:
