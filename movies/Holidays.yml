templates:
  #####################################
  #    Custom Collection Templates    #
  #####################################
  # Holiday template: used by all collections below.
  # Defaults: stay inside the library UI; DO NOT pin to Home or Shared.
  # Cleanup: auto-delete when outside schedule (no orphans lingering).
  Holiday:
    # ----- VISIBILITY DEFAULTS (override per collection below) -----
    # Where the row appears in Plex:
    # - visible_home:   controls row on YOUR Plex Home screen
    # - visible_shared: controls row on shared users’ Home screens
    # - visible_library: row shown inside the library’s Collections shelf
    visible_home: false
    visible_shared: false
    visible_library: true

    # When Kometa runs:
    sync_mode: sync            # keep collection members in sync with sources
    run_again: true            # evaluate every run
    delete_not_scheduled: true # if today is outside `schedule`, remove the collection

    # Optional: consistent sort + summary
    smart_label: title.asc
    summary: >
      A timed collection of <<holiday>> movies (and related titles).
      This collection automatically disappears outside its schedule window.

collections:
  #####################################
  #        Holiday Collections        #
  #####################################

  # Example policy:
  # - Most holiday rows are library-only (true/false/true)
  # - If you want one to appear on Home, set visible_home: true on that block.

  Valentines Day Movies:
    # ----- PER-COLLECTION VISIBILITY (override defaults) -----
    visible_home: false        # change to true if you want it on Home in-season
    visible_shared: false
    visible_library: true

    # ----- SCHEDULE / SOURCES / SORT -----
    schedule: range(01/25-02/14)
    sort_title: '!AAF'
    template: { name: Holiday, holiday: "Valentine's Day" }
    smart_label: audience_rating.desc
    imdb_list:
      - https://www.imdb.com/list/ls000094398/
      - https://www.imdb.com/list/ls057783436/
      - https://www.imdb.com/list/ls064427905/

  St Patricks Day Movies:
    visible_home: false
    visible_shared: false
    visible_library: true

    schedule: range(03/01-03/17)
    template: { name: Holiday, holiday: "St. Patrick's Day" }
    smart_label: audience_rating.desc
    imdb_list: https://www.imdb.com/list/ls063934595/

  Ethereal Enigmas:
    visible_home: false
    visible_shared: false
    visible_library: true

    schedule: range(08/01-11/05)
    sort_title: '!AAC'
    template: { name: Holiday, holiday: "spooky and haunting" }
    smart_label: audience_rating.desc
    limit: 100
    file_poster: config/Posters/Halloween/ethereal_enigmas.png
    imdb_list:
      - https://www.imdb.com/list/ls542818237/

  Halloween Favorites:
